name: Release

# Публикует релиз при пуше тега вида v1.2.3.
# Версия берётся из тега, поэтому в csproj её править не нужно.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия для тестовой сборки (без v)'
        required: true
        default: '0.0.0'

permissions:
  contents: write   # нужно для создания релиза и загрузки файлов

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Determine version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF -replace '^refs/tags/v', ''
          } else {
            $v = '${{ github.event.inputs.version }}'
          }
          # AssemblyVersion требует числовой формат X.Y.Z(.W) — отбрасываем суффиксы.
          $numeric = ($v -split '[-+]')[0]
          if ($numeric -notmatch '^\d+(\.\d+){1,3}$') {
            throw "Версия '$v' не похожа на X.Y.Z"
          }
          "version=$v"          >> $env:GITHUB_OUTPUT
          "numeric=$numeric"    >> $env:GITHUB_OUTPUT
          Write-Host "Версия: $v (числовая $numeric)"

      - name: Test
        run: dotnet test --configuration Release

      - name: Publish single-file exe
        run: >
          dotnet publish KeyLangSwitcher
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:Version=${{ steps.ver.outputs.numeric }}
          -p:FileVersion=${{ steps.ver.outputs.numeric }}
          -p:AssemblyVersion=${{ steps.ver.outputs.numeric }}

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=${{ steps.ver.outputs.version }}" installer\KeyLangSwitcher.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup завершился с ошибкой" }

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: KeyLangSwitcher-${{ steps.ver.outputs.version }}
          path: dist/*.exe

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: KeyLangSwitcher ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: dist/*.exe
