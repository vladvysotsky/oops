name: Release

# Публикует релиз при пуше тега вида v1.2.3.
# Версия берётся из тега, поэтому в csproj её править не нужно.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Версия для тестовой сборки (без v)'
        required: true
        default: '0.0.0'

permissions:
  contents: write   # нужно для создания релиза и загрузки файлов

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Determine version
        id: ver
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $v = $env:GITHUB_REF -replace '^refs/tags/v', ''
          } else {
            $v = '${{ github.event.inputs.version }}'
          }
          # AssemblyVersion требует числовой формат X.Y.Z(.W) — отбрасываем суффиксы.
          $numeric = ($v -split '[-+]')[0]
          if ($numeric -notmatch '^\d+(\.\d+){1,3}$') {
            throw "Версия '$v' не похожа на X.Y.Z"
          }
          "version=$v"          >> $env:GITHUB_OUTPUT
          "numeric=$numeric"    >> $env:GITHUB_OUTPUT
          Write-Host "Версия: $v (числовая $numeric)"

      - name: Test
        run: dotnet test --configuration Release

      # Установщику single-file не нужен и вреден: exe распаковывал бы себя во
      # временную папку и грузил сборки оттуда, а уборка временных файлов
      # выгрызала из неё то, что программа ещё ни разу не открывала — .NET при
      # этом повторно не распаковывает, и замена падала при каждом запуске.
      # Установленная программа и так живёт в своей папке, DLL лежат рядом.
      - name: Publish for the installer (plain folder)
        run: >
          dotnet publish Oops
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=false
          --output build\app
          -p:Version=${{ steps.ver.outputs.numeric }}
          -p:FileVersion=${{ steps.ver.outputs.numeric }}
          -p:AssemblyVersion=${{ steps.ver.outputs.numeric }}

      # Портативный вариант обязан быть одним файлом, поэтому здесь single-file
      # со всей его распаковкой остаётся. Отдельная папка вывода — чтобы две
      # публикации не перемешались.
      - name: Publish single-file exe (portable)
        run: >
          dotnet publish Oops
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:IncludeAllContentForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          --output build\portable
          -p:Version=${{ steps.ver.outputs.numeric }}
          -p:FileVersion=${{ steps.ver.outputs.numeric }}
          -p:AssemblyVersion=${{ steps.ver.outputs.numeric }}

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "/DMyAppVersion=${{ steps.ver.outputs.version }}" installer\Oops.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup завершился с ошибкой" }

      # Портативный вариант: та же программа без установки, для тех, кому
      # инсталлятор не нужен или не разрешён политиками.
      - name: Pack portable zip
        shell: pwsh
        run: |
          $src = "build\portable\oops.exe"
          if (-not (Test-Path $src)) { throw "Не найден собранный exe: $src" }
          Compress-Archive -Path $src -DestinationPath "dist\oops-portable-${{ steps.ver.outputs.version }}.zip" -Force

      # Сборки не подписаны сертификатом, поэтому даём возможность проверить,
      # что скачанный файл — ровно тот, что собрал этот запуск CI.
      - name: Write SHA256 checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -Include *.exe, *.zip -Recurse |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "{0}  {1}" -f $_.Hash.ToLower(), (Split-Path $_.Path -Leaf) } |
            Set-Content dist\SHA256SUMS.txt -Encoding ascii
          Get-Content dist\SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: oops-${{ steps.ver.outputs.version }}
          path: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt

      # Описание релиза пишем сами: автогенерация собирает его из смерженных
      # pull request'ов, и при пуше прямо в main (или при теге на коммите без
      # PR) в релизе оставалась одна строка «Full Changelog». Файл лежит
      # рядом с кодом, правится в том же коммите и проходит ревью вместе с ним.
      - name: Prepare release notes
        shell: pwsh
        run: |
          $src = "docs/release-notes/v${{ steps.ver.outputs.version }}.md"
          if (Test-Path $src) {
            Write-Host "Беру описание из $src"
            Copy-Item $src dist/RELEASE_NOTES.md
          } else {
            Write-Host "::warning::Нет $src — описание будет только автогенерированное"
            # Пустой файл, а не пропуск шага: body_path должен существовать
            # всегда, иначе публикация падает на несуществующем пути.
            Set-Content dist/RELEASE_NOTES.md '' -Encoding utf8
          }

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: oops ${{ steps.ver.outputs.version }}
          # body_path идёт ПЕРЕД автогенерацией: action дописывает
          # сгенерированный список изменений после нашего текста.
          body_path: dist/RELEASE_NOTES.md
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt
